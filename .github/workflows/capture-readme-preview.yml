name: Capture README screenshot
on:
  pull_request:
    paths:
      - .github/workflows/capture-readme-preview.yml
permissions:
  contents: write
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Capture live desktop page
        run: |
          mkdir -p docs/images
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=7000 --window-size=1440,900 --screenshot=docs/images/screenshot-desktop.png 'https://riccardobuzzolan.github.io/'
          test -s docs/images/screenshot-desktop.png
      - name: Store screenshot in this pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/screenshot-desktop.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiunge screenshot reale della pagina"
            git push origin HEAD:${{ github.head_ref }}
          fi
