name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Temporary Prettier diagnostic
        run: |
          npx prettier --write scripts/check-public-demo.mjs
          node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log('FORMATTED_DEMO::' + JSON.stringify(readFileSync('scripts/check-public-demo.mjs','utf8')))"
      - name: Check formatting
        run: npm run format:check
      - name: Lint JavaScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Check local links and JSON-LD
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:links
      - name: Verify animation and media behavior
        run: npm test
