name: Format files in documentation PR
on:
  pull_request:
    paths:
      - .github/workflows/format-readme-pr.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only the three flagged files
        run: npx prettier --write assets/css/ascii-sharks-hero.css assets/js/ascii-sharks-hero.js index.html
      - name: Check syntax and links
        run: |
          npm run lint
          npm run check:links
          npm test
          npm run format:check
      - name: Commit checked formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/ascii-sharks-hero.css assets/js/ascii-sharks-hero.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Allinea la formattazione ai controlli del progetto"
            git push origin HEAD:${{ github.head_ref }}
          fi
