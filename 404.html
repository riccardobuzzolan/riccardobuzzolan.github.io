<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina non trovata | Riccardo Buzzolan</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #102d61;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 84%, rgba(255,92,81,.55), transparent 35%),
        radial-gradient(circle at 88% 84%, rgba(35,63,156,.65), transparent 36%),
        radial-gradient(circle at 86% 10%, rgba(255,171,54,.55), transparent 31%),
        #f5ead7;
    }
    .card {
      width: min(680px, 100%);
      padding: 56px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 28px;
      background: rgba(255,255,255,.62);
      box-shadow: 0 24px 80px rgba(16,45,97,.18);
      backdrop-filter: blur(18px);
    }
    h1 {
      margin: 0;
      font: 500 clamp(5rem,20vw,10rem)/.9 Georgia,serif;
    }
    h2 {
      font: 500 clamp(1.8rem,6vw,3rem)/1.1 Georgia,serif;
    }
    p {
      line-height: 1.6;
      color: #46536c;
    }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #102d61;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <h2>Pagina non trovata</h2>
    <p>L’indirizzo non esiste oppure il contenuto è stato spostato.</p>
    <a href="/">Torna al portfolio</a>
  </main>
</body>
</html>
